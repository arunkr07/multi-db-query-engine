services:
  postgres:
    image: postgres:17
    container_name: mqe-test-postgres
    environment:
      POSTGRES_DB: mqe_test
      POSTGRES_USER: mqe_test
      POSTGRES_PASSWORD: mqe_local_test_password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mqe_test -d mqe_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    container_name: mqe-test-mysql
    environment:
      MYSQL_DATABASE: mqe_test
      MYSQL_USER: mqe_test
      MYSQL_PASSWORD: mqe_local_test_password
      MYSQL_ROOT_PASSWORD: mqe_local_root_password
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u mqe_test --password=mqe_local_test_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongodb:
    image: mongo:8
    container_name: mqe-test-mongodb
    ports:
      - "127.0.0.1:57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: mqe-test-redis
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20